name: Rust CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "contracts/**"

jobs:
  rust-checks:
    name: Clippy and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p anchorpoint-utils -p anchorpoint-security-registry -p event-hub --all-targets --all-features -- -D warnings

      - name: Build (wasm32)
        run: cargo build --target wasm32v1-none --release

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: WASM Optimization & Size Threshold Check
        run: |
          chmod +x tools/optimize-wasm.sh
          ./tools/optimize-wasm.sh target/wasm32v1-none/release

      - uses: taiki-e/install-action@v2

        with:
          tool: cargo-scout-audit@0.3.16
          tool: cargo-audit@0.21.0

      - name: Install Scout system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config gcc

      # #1243: scan the Rust dependency graph for crates with known
      # advisories. Installed by the same taiki-e/install-action step as
      # cargo-scout-audit above, so no cargo install (and its compile time)
      # is needed.
      - name: Install cargo-audit
        run: cargo audit --version

      - name: Audit Rust dependencies (cargo-audit)
        run: |
          if cargo audit; then
            echo "cargo-audit: no known vulnerabilities in the dependency graph."
          else
            echo "::error::cargo-audit found advisories in the Rust dependency graph (listed above)."
            cargo audit --json > cargo-audit.json || true
            exit 1
          fi

      - name: Test sep41-token
        run: cargo test -p sep41-token

      - name: Test upgradeable
        run: cargo test -p upgradeable

      - name: Record staking snapshot gas benchmarks
        run: cargo test -p soroban-gas-benchmarks benchmark_ -- --nocapture

      - name: Run Security Audit
        run: ./scripts/security-audit.sh --warn-only
      - name: Test
        run: cargo test -p anchorpoint-utils -p anchorpoint-security-registry -p event-hub --all-features

  mutation-testing:
    name: Mutation testing (cargo-mutants)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config gcc

      - name: Mutation test token and staking contracts
        run: cargo mutants --config mutants.toml -p sep41-token -p staking -j 2

  contracts-mutation-testing:
    name: Contracts mutation testing (cargo-mutants)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config gcc

      # Mutates the crates listed in contracts/mutants.toml (anchorpoint,
      # staking, swap, governance, liquid_staking). Exit code 2 (missed
      # mutants) and 3 (timeouts) are left to the kill-rate gate below; any
      # other non-zero exit is a build or usage failure.
      - name: Mutation test contracts workspace
        run: |
          set +e
          cargo mutants --config mutants.toml --workspace --in-place
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then
            echo "::error::cargo-mutants failed with exit code $status"
            exit "$status"
          fi

      # Killed = caught + timed out; unviable mutants (do not compile) are not
      # counted.
      - name: Enforce mutation kill rate (>= 85%)
        run: |
          caught=$(jq '.caught' mutants.out/outcomes.json)
          missed=$(jq '.missed' mutants.out/outcomes.json)
          timeout=$(jq '.timeout' mutants.out/outcomes.json)
          viable=$((caught + missed + timeout))
          if [ "$viable" -eq 0 ]; then
            echo "::error::cargo-mutants produced no viable mutants"
            exit 1
          fi
          rate=$(( (caught + timeout) * 100 / viable ))
          echo "Mutation kill rate: ${rate}% (caught=$caught timeout=$timeout missed=$missed)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rate" -lt 85 ]; then
            echo "::error::Mutation kill rate ${rate}% is below 85%. Missed mutants are listed in mutants.out/missed.txt."
            exit 1
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-mutants-report
          path: contracts/mutants.out/
          if-no-files-found: warn
          retention-days: 30
