name: Rust CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "contracts/**"

jobs:
  rust-checks:
    name: Clippy and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p anchorpoint-utils -p anchorpoint-security-registry -p event-hub --all-targets --all-features -- -D warnings

      - name: Build (wasm32)
        run: cargo build --target wasm32v1-none --release

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: WASM Optimization & Size Threshold Check
        run: |
          chmod +x tools/optimize-wasm.sh
          ./tools/optimize-wasm.sh target/wasm32v1-none/release

      - uses: taiki-e/install-action@v2

        with:
          tool: cargo-scout-audit@0.3.16
          tool: cargo-audit@0.21.0

      - name: Install Scout system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config gcc

      # #1243: scan the Rust dependency graph for crates with known
      # advisories. Installed by the same taiki-e/install-action step as
      # cargo-scout-audit above, so no cargo install (and its compile time)
      # is needed.
      - name: Install cargo-audit
        run: cargo audit --version

      - name: Audit Rust dependencies (cargo-audit)
        run: |
          if cargo audit; then
            echo "cargo-audit: no known vulnerabilities in the dependency graph."
          else
            echo "::error::cargo-audit found advisories in the Rust dependency graph (listed above)."
            cargo audit --json > cargo-audit.json || true
            exit 1
          fi

      - name: Test sep41-token
        run: cargo test -p sep41-token

      - name: Test upgradeable
        run: cargo test -p upgradeable

      - name: Run Security Audit
        run: ./scripts/security-audit.sh --warn-only
      - name: Test
        run: cargo test -p anchorpoint-utils -p anchorpoint-security-registry -p event-hub --all-features

  mutation-testing:
    name: Mutation testing (cargo-mutants)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config gcc

      - name: Mutation test token and staking contracts
        run: cargo mutants --config mutants.toml -p sep41-token -p staking -j 2

      - name: Mutation test liquid staking contract
        working-directory: contracts
        run: cargo mutants --config mutants.toml -p liquid_staking --in-place
