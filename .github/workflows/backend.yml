name: Backend CI/CD

on:
  push:
    branches: ["**"]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'backend/trivy-backend.sarif'

  validate:
    name: Validate Migration Integrity (${{ matrix.db_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_name: cidb_ci_1
            shadow_db_name: shadowdb_ci_1
          - db_name: cidb_ci_2
            shadow_db_name: shadowdb_ci_2
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      # Unique database per matrix runner so concurrent jobs never share state.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/${{ matrix.db_name }}"
      SHADOW_DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/${{ matrix.shadow_db_name }}"

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.db_name }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-shadow:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.shadow_db_name }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit

      # Generate the Prisma client before any migration steps so that all
      # downstream commands (migrate deploy, migrate diff, ts-node scripts)
      # have the correct client bindings available.
      - name: Generate Prisma client
        run: npx prisma generate

      # Fast environment check — fails immediately with a clear message if
      # DATABASE_URL is missing or malformed, rather than surfacing a cryptic
      # Prisma error several steps later.
      - name: Validate migration environment
        run: node scripts/validate-migration-env.js

      # Clean the verification database schema before running migrations
      # This ensures a fresh state and prevents "relation already exists" errors
      - name: Clean verification database schema
        run: |
          npx prisma db execute --url "$DATABASE_URL" --stdin <<EOF
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          EOF

      - name: Verify Migrations Against Temporary Database
        env:
          VERIFY_MIGRATIONS_ALLOW_RESET: "true"
        run: npm run migrate:verify

      - name: Run Migration Integrity Checker
        run: node scripts/check-migrations.js

      # Emit migration status as an artefact so reviewers can see which
      # migrations are applied without re-running CI.
      - name: Report migration status
        if: always()
        run: |
          echo "## Migration Status" > migration-status.md
          npx prisma migrate status >> migration-status.md 2>&1 || true

      - name: Upload migration status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-status-${{ matrix.db_name }}
          path: backend/migration-status.md
          retention-days: 7

      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -q -h 127.0.0.1 -p 5432 -U postgres && break
            sleep 1
          done

      - name: Run DB migrations
        run: npx prisma migrate deploy || npx prisma db push

      - name: Run Lint
        run: npm run lint

      - name: Validate OpenAPI spec
        run: npm run swagger:validate

      - name: Run Tests
        run: npm test

      # Repeatedly run the integration suite to prove there is no flakiness.
      # Each iteration starts from a clean schema so state cannot leak between runs.
      - name: Verify zero flakiness (10 consecutive runs)
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "::group::Integration test run $i/10"
            npx prisma db execute --url "$DATABASE_URL" --stdin <<EOF
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          EOF
            npx prisma migrate deploy
            npm test
            echo "::endgroup::"
          done

      - name: Cleanup test artifacts
        if: always()
        run: rm -rf coverage logs test.db* migration-status.md
