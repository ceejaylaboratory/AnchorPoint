name: Lint PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest

    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
          scopes: |
            backend
            dashboard
            contracts
            infra
            ci
            deps
          requireScope: false
          subjectPattern: ^.+[^.]$
          subjectPatternError: |
            The PR title subject must not end with a period.
            Expected format: `type(scope): description`
            Example: `feat(backend): add portfolio balance endpoint`
