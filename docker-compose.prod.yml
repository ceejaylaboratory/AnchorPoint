x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment:
    - NODE_ENV=production
    - PORT=3002
    - DATABASE_URL=postgresql://${POSTGRES_USER:-anchorpoint}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production environment}@postgres:5432/${POSTGRES_DB:-anchorpoint}
    - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your production environment}@redis:6379
    - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    - PROMETHEUS_METRICS_PORT=9464
    - OTEL_SERVICE_NAME=anchorpoint-backend
    - OTEL_RESOURCE_ATTRIBUTES=service.name=anchorpoint-backend,service.version=1.0.0
    # Cap the V8 heap below the 1.5G memory limit so GC runs before an OOM kill
    - NODE_OPTIONS=--max-old-space-size=1200
  deploy:
    resources:
      reservations:
        cpus: "0.25"
        memory: 512M
      limits:
        cpus: "1.0"
        memory: 1536M
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    # Liveness only: /health/live does not depend on external RPC status.
    # start_period gives migrations and secret/KMS hydration time on cold starts.
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health/live"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 40s
  restart: unless-stopped
  # Read-only root filesystem; /tmp and /app/uploads are the only writable
  # paths, as ephemeral tmpfs mounts owned by the image's app user (10001).
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=1777
    - /app/uploads:uid=10001,gid=10001,mode=0700
  networks:
    - anchorpoint-production-network

services:
  proxy:
    # nginx built with the ngx_brotli module (used by infra/nginx/nginx.conf)
    image: fholzer/nginx-brotli:v1.28.0
    container_name: anchorpoint-proxy
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 64M
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/main.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      dashboard:
        condition: service_healthy
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - anchorpoint-production-network

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 64M
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - anchorpoint-production-network

  backend-1:
    <<: *backend-common

  backend-2:
    <<: *backend-common

  backend-3:
    <<: *backend-common

  postgres:
    image: postgres:16-alpine
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M
        limits:
          cpus: "2.0"
          memory: 2G
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-anchorpoint}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production environment}
      - POSTGRES_DB=${POSTGRES_DB:-anchorpoint}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anchorpoint}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - anchorpoint-production-network

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your production environment}
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 128M
        limits:
          cpus: "0.5"
          memory: 512M
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in your production environment}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - anchorpoint-production-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles:
      - monitoring
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 128M
        limits:
          cpus: "0.5"
          memory: 512M
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - anchorpoint-production-network

  smoke-test:
    image: alpine:3.20
    profiles:
      - smoke
    deploy:
      resources:
        reservations:
          cpus: "0.05"
          memory: 32M
        limits:
          cpus: "0.25"
          memory: 128M
    depends_on:
      backend-1:
        condition: service_healthy
    environment:
      TARGET_HOST: http://backend-1:3002
      SMOKE_TEST_ACCOUNT: ${SMOKE_TEST_ACCOUNT:-GB7KUA47QKRI6Q6X7C3HOC2HEP6VJQRQWQYQF66VJPHJRVMEDJOVML6K}
    volumes:
      - ./scripts/smoke-test.sh:/smoke-test.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "apk add --no-cache bash curl jq >/dev/null && bash /smoke-test.sh"
    restart: "no"
    networks:
      - anchorpoint-production-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  anchorpoint-production-network:
    driver: bridge
