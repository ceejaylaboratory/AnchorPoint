version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: anchorpoint-dashboard
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - anchorpoint-network

  postgres:
    image: postgres:16-alpine
    container_name: anchorpoint-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-anchorpoint}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment or .env file}
      - POSTGRES_DB=${POSTGRES_DB:-anchorpoint}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchorpoint"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - anchorpoint-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anchorpoint-backend
    ports:
      - "3002:3002"
      - "9464:9464"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-anchorpoint}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment or .env file}@postgres:5432/${POSTGRES_DB:-anchorpoint}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your local environment or .env file}@redis:6379
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - PROMETHEUS_METRICS_PORT=9464
      - OTEL_SERVICE_NAME=anchorpoint-backend
      - OTEL_RESOURCE_ATTRIBUTES=service.name=anchorpoint-backend,service.version=1.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns_opt:
      - ndots:2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      anchorpoint-network:
        aliases:
          - stellar-core
          - soroban-rpc

  redis:
    image: redis:7-alpine
    container_name: anchorpoint-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your local environment or .env file}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in your local environment or .env file}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - anchorpoint-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: anchorpoint-jaeger
    profiles:
      - monitoring
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "14250:14250"  # gRPC collector
      - "6831:6831/udp" # UDP agent
      - "6832:6832/udp" # UDP agent
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - anchorpoint-network

  prometheus:
    image: prom/prometheus:latest
    container_name: anchorpoint-prometheus
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/monitoring/prometheus-alerts.yml:/etc/prometheus/rules/prometheus-alerts.yml
      - ./infra/prometheus/alerts.rules.yml:/etc/prometheus/rules/alerts.rules.yml
      - ./alerts.yml:/etc/prometheus/rules/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - anchorpoint-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: anchorpoint-alertmanager
    profiles:
      - monitoring
    ports:
      - "9093:9093"
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--config.expand-env'
    environment:
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    restart: unless-stopped
    networks:
      - anchorpoint-network

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: anchorpoint-blackbox-exporter
    profiles:
      - monitoring
    ports:
      - "9115:9115"
    volumes:
      - ./infra/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    restart: unless-stopped
    networks:
      - anchorpoint-network

  loki:
    image: grafana/loki:2.9.4
    container_name: anchorpoint-loki
    profiles:
      - monitoring
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    restart: unless-stopped
    networks:
      - anchorpoint-network

  promtail:
    image: grafana/promtail:2.9.4
    container_name: anchorpoint-promtail
    profiles:
      - monitoring
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-config.file=/etc/promtail/promtail-config.yml'
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - anchorpoint-network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: anchorpoint-grafana
    profiles:
      - monitoring
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your local environment or .env file}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - anchorpoint-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local

networks:
  anchorpoint-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'true'
    ipam:
      config:
        - subnet: 172.28.0.0/16
