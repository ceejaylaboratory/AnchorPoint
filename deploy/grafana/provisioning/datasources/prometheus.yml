# deploy/grafana/provisioning/datasources/prometheus.yml
# ---------------------------------------------------------------------------
# Grafana auto-provisioning: Prometheus data source
# Grafana reads this file at startup; no manual UI configuration is required.
# ---------------------------------------------------------------------------
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
