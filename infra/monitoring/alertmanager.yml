global:
  resolve_timeout: 5m

# Alertmanager can expand environment variables when started with
# --config.expand-env=true. We use that to keep PagerDuty routing keys and
# Slack webhook URLs out of git.
route:
  receiver: pagerduty-critical
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    # TLS certificate renewal alerts are routed to the platform Slack channel in
    # addition to PagerDuty so the on-call has a low-friction early signal when a
    # Let's Encrypt certificate is at risk of not auto-renewing.
    - matchers:
        - service="cert-manager"
      receiver: slack-cert-renewal
      continue: true
    - matchers:
        - severity="warning"
      receiver: pagerduty-warning
      continue: true
    - matchers:
        - severity="critical"
      receiver: pagerduty-critical
    - matchers:
        - alertname="DatabaseConnectionExhausted"
      receiver: slack-ops
      continue: true

receivers:
  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}
        severity: '{{ .CommonLabels.severity }}'
        class: '{{ .CommonLabels.service }}'
        summary: '{{ .CommonAnnotations.summary }}'
        description: |-
          Alert: {{ .CommonLabels.alertname }}
          Service: {{ .CommonLabels.service }}
          Severity: {{ .CommonLabels.severity }}
          Team: {{ .CommonLabels.team }}

          {{ .CommonAnnotations.description }}
        source: AnchorPoint Prometheus
        send_resolved: true

  - name: pagerduty-warning
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}
        severity: '{{ .CommonLabels.severity }}'
        class: '{{ .CommonLabels.service }}'
        summary: '{{ .CommonAnnotations.summary }}'
        description: |-
          Alert: {{ .CommonLabels.alertname }}
          Service: {{ .CommonLabels.service }}
          Severity: {{ .CommonLabels.severity }}

          {{ .CommonAnnotations.description }}
        source: AnchorPoint Prometheus
        send_resolved: true

  - name: slack-ops
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: '#ops-alerts'
        title: '{{ .CommonAnnotations.summary }}'
        text: |-
          {{ range .Alerts }}
            *Alert:* {{ .Labels.alertname }}
            *Service:* {{ .Labels.service }}
            *Severity:* {{ .Labels.severity }}
            *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  # Dedicated channel for automated TLS certificate renewal notifications.
  # Set SLACK_WEBHOOK_URL in the Alertmanager environment (with --config.expand-env=true).
  - name: slack-cert-renewal
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: '#platform-cert-alerts'
        send_resolved: true
        title: '{{ if eq .Status "resolved" }}✅ Resolved{{ else }}{{ if eq .CommonLabels.severity "critical" }}🚨 Critical{{ else }}⚠️ Warning{{ end }}{{ end }}: {{ .CommonAnnotations.summary }}'
        text: |-
          Alert: {{ .CommonLabels.alertname }}
          Service: {{ .CommonLabels.service }}
          Severity: {{ .CommonLabels.severity }}

          {{ .CommonAnnotations.description }}

          Runbook: {{ .CommonAnnotations.runbook_url }}

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'service']
