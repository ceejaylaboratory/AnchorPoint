global:
  resolve_timeout: 5m

# Alertmanager can expand environment variables when started with
# --config.expand-env=true. We use that to keep PagerDuty routing keys and
# Slack webhook URLs out of git.
route:
  receiver: pagerduty-critical
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    # TLS certificate renewal alerts are routed to the platform Slack channel in
    # addition to PagerDuty so the on-call has a low-friction early signal when a
    # Let's Encrypt certificate is at risk of not auto-renewing.
    - matchers:
        - service="cert-manager"
      receiver: slack-cert-renewal
      continue: true
    - matchers:
        - severity="warning"
      receiver: pagerduty-warning
      continue: true
    - matchers:
        - severity="critical"
      receiver: pagerduty-critical
    - matchers:
        - alertname="DatabaseConnectionExhausted"
      receiver: slack-ops
      continue: true
    # API error rate, slow query, and queue latency alerts are routed to the
    # ops Slack channel and email so operators get an immediate signal.
    - matchers:
        - alertname=~"HighApiErrorRate|SlowDatabaseQueries|HighQueueLatency"
      receiver: slack-ops
      continue: true
    - matchers:
        - alertname=~"HighApiErrorRate|SlowDatabaseQueries|HighQueueLatency"
      receiver: email-ops

receivers:
  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}
        severity: '{{ .CommonLabels.severity }}'
        class: '{{ .CommonLabels.service }}'
        summary: '{{ .CommonAnnotations.summary }}'
        description: |-
          Alert: {{ .CommonLabels.alertname }}
          Service: {{ .CommonLabels.service }}
          Severity: {{ .CommonLabels.severity }}
          Team: {{ .CommonLabels.team }}

          {{ .CommonAnnotations.description }}
        source: AnchorPoint Prometheus
        send_resolved: true

  - name: pagerduty-warning
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}
        severity: '{{ .CommonLabels.severity }}'
        class: '{{ .CommonLabels.service }}'
        summary: '{{ .CommonAnnotations.summary }}'
        description: |-
          Alert: {{ .CommonLabels.alertname }}
          Service: {{ .CommonLabels.service }}
          Severity: {{ .CommonLabels.severity }}

          {{ .CommonAnnotations.description }}
        source: AnchorPoint Prometheus
        send_resolved: true

  - name: slack-ops
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: '#ops-alerts'
        title: '{{ .CommonAnnotations.summary }}'
        text: |-
          {{ range .Alerts }}
            *Alert:* {{ .Labels.alertname }}
            *Service:* {{ .Labels.service }}
            *Severity:* {{ .Labels.severity }}
            *Description:* {{ .Annotations.description }}
            *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true

  # Email notifications for the ops team. SMTP settings are supplied via
  # environment variables (with --config.expand-env=true) to keep credentials
  # out of git.
  - name: email-ops
    email_configs:
      - to: ${ALERTMANAGER_EMAIL_TO}
        from: ${ALERTMANAGER_EMAIL_FROM}
        smarthost: ${ALERTMANAGER_SMTP_SMARTHOST}
        auth_username: ${ALERTMANAGER_SMTP_USERNAME}
        auth_password: ${ALERTMANAGER_SMTP_PASSWORD}
        require_tls: true
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ else }}[FIRING] {{ end }}{{ .CommonAnnotations.summary }}'
        html: |-
          {{ range .Alerts }}
            <p>
              <strong>Alert:</strong> {{ .Labels.alertname }}<br/>
              <strong>Service:</strong> {{ .Labels.service }}<br/>
              <strong>Severity:</strong> {{ .Labels.severity }}<br/>
              <strong>Description:</strong> {{ .Annotations.description }}<br/>
              <strong>Runbook:</strong> <a href="{{ .Annotations.runbook_url }}">{{ .Annotations.runbook_url }}</a>
            </p>
          {{ end }}

  # Dedicated channel for automated TLS certificate renewal notifications.
  # Set SLACK_WEBHOOK_URL in the Alertmanager environment (with --config.expand-env=true).
  - name: slack-cert-renewal
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: '#platform-cert-alerts'
        send_resolved: true
        title: '{{ if eq .Status "resolved" }}✅ Resolved{{ else }}{{ if eq .CommonLabels.severity "critical" }}🚨 Critical{{ else }}⚠️ Warning{{ end }}{{ end }}: {{ .CommonAnnotations.summary }}'
        text: |-
          Alert: {{ .CommonLabels.alertname }}
          Service: {{ .CommonLabels.service }}
          Severity: {{ .CommonLabels.severity }}

          {{ .CommonAnnotations.description }}

          Runbook: {{ .CommonAnnotations.runbook_url }}

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'service']
