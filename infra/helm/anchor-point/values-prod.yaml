# =============================================================================
# AnchorPoint Helm Chart - Production Overrides
# =============================================================================
# Apply on top of values.yaml:
#
#   helm upgrade --install anchor-point ./infra/helm/anchor-point \
#     -f infra/helm/anchor-point/values-prod.yaml \
#     --namespace anchorpoint-prod --create-namespace
# =============================================================================

namespace: anchorpoint-prod

image:
  repository: ghcr.io/ceejaylaboratory/anchorpoint-backend
  pullPolicy: IfNotPresent
  tag: ""   # REQUIRED — set via --set image.tag=<semver> in CI/CD; empty string fails helm lint intentionally

replicaCount: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0   # Zero-downtime: no pod is removed before a new one is Ready
    maxSurge: 1

# -- Non-sensitive config overrides -------------------------------------------
config:
  LOG_LEVEL: "warn"
  NODE_ENV: "production"
  PORT: "3002"
  METRICS_PORT: "9464"
  STELLAR_NETWORK: "mainnet"
  QUEUE_CONCURRENCY: "10"
  REQUEST_TIMEOUT_MS: "30000"

# -- Ingress ------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "anchorpoint-prod-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "63072000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    # Strict security headers (HSTS preload, CSP, clickjacking protection).
    # frame-ancestors allows the designated SEP-24 partner domains to embed
    # interactive flows while blocking all other framing.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://*.partner.example.com";
    # Rate limiting to protect the production API
    nginx.ingress.kubernetes.io/limit-rps: "50"
  hosts:
    - host: api.anchorpoint.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: anchorpoint-api-prod-tls
      hosts:
        - api.anchorpoint.example.com

# -- Resources (production-grade) ---------------------------------------------
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# -- HPA (enabled in production) ----------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# -- PDB (enabled in production for HA) ---------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# -- Affinity: spread pods across availability zones --------------------------
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: anchor-point
          topologyKey: topology.kubernetes.io/zone

# -- Secrets: point to a pre-created production secret -----------------------
secrets:
  existingSecret: "anchorpoint-prod-secrets"
  keys:
    - REDIS_URL
    - DATABASE_URL
    - STELLAR_PASSPHRASE
    - STELLAR_DEPLOYER_SECRET
    - JWT_SECRET
    - KMS_KEY_ID
    - HORIZON_URL

# -- Datastores and dashboard ------------------------------------------------
# Production keeps Redis and Postgres external (managed instances with
# replication and PITR). The chart's Redis/Postgres templates are
# single-replica and are therefore left disabled here — see the warning in
# values.yaml before turning either on.
redis:
  enabled: false
  auth:
    existingSecret: "anchorpoint-prod-redis"
    secretKey: redis-password

postgres:
  enabled: false
  auth:
    existingSecret: "anchorpoint-prod-postgres"
    userKey: postgres-user
    passwordKey: postgres-password

dashboard:
  enabled: true
  replicaCount: 3
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/nginx_status"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "anchorpoint-prod-issuer"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/hsts: "true"
      nginx.ingress.kubernetes.io/hsts-max-age: "63072000"
      nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
      nginx.ingress.kubernetes.io/hsts-preload: "true"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
        more_set_headers "X-Content-Type-Options: nosniff";
        more_set_headers "X-Frame-Options: DENY";
        more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
        more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://*.partner.example.com";
    hosts:
      - host: dashboard.anchorpoint.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: anchorpoint-dashboard-prod-tls
        hosts:
          - dashboard.anchorpoint.example.com

# -- Centralized log aggregation (Loki + Promtail) ---------------------------
# Container logs are shipped to Loki by Promtail and queried in Grafana
# Explore. Retention is enforced by Loki (720h = 30 days).
loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: "2.9.6"
    pullPolicy: IfNotPresent
  retention: "720h"
  storage:
    chunkStore: filesystem
    chunkTargetSize: "1572864"
    maxChunkAge: "1h"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: "2.9.6"
    pullPolicy: IfNotPresent
  lokiUrl: "http://anchor-point-loki:3100/loki/api/v1/push"
  environment: "production"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
