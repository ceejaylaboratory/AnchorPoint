{{/*
=============================================================================
Redis — optional Deployment for the BullMQ queues.

Disabled by default: production should use a managed Redis. When enabled the
password is read from a Secret and the Deployment's readiness probe reads the
same key, so the password is never written into a manifest, a ConfigMap, or a
command line that `kubectl describe` would print.

Redis loses in-flight queue state on restart unless persistence is enabled, so
redis.persistence is on by default here even though it costs a PVC.
=============================================================================
*/}}
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anchor-point.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anchor-point.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "anchor-point.redis.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anchor-point.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anchor-point.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: {{ .Values.redis.replicaCount }}
  selector:
    matchLabels:
      {{- include "anchor-point.redis.selectorLabels" . | nindent 6 }}
  strategy:
    # The data volume is ReadWriteOnce, so a RollingUpdate would deadlock: the
    # new pod cannot attach the PVC until the old pod releases it.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "anchor-point.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
      {{- with .Values.redis.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anchor-point.redis.secretName" . }}
                  key: {{ .Values.redis.auth.secretKey }}
          # --requirepass reads the value from the environment so the password
          # does not end up in the container command line.
          command:
            - sh
            - -ec
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly {{ .Values.redis.appendOnly | quote }}
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem is on, so Redis needs a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.redis.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.redis.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "anchor-point.redis.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anchor-point.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
  {{- with .Values.redis.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
