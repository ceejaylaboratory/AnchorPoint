{{/*
=============================================================================
Ingress — routes external HTTPS traffic via the NGINX ingress controller.

Mirrors the setup in infra/k8s/ingress-nginx/anchorpoint-testnet-ingress.yaml:
  - ingressClassName: nginx
  - cert-manager annotation for automatic TLS certificate provisioning
  - HSTS headers enforced at the ingress layer
  - Per-environment host/TLS overrides via values-staging.yaml / values-prod.yaml
=============================================================================
*/}}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "anchor-point.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anchor-point.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if and .Values.ingress.securityHeaders .Values.ingress.securityHeaders.enabled }}
  {{- $sh := .Values.ingress.securityHeaders }}
  {{- $frameAncestors := "'self'" }}
  {{- range ($sh.sep24FrameAncestors | default list) }}
  {{- $frameAncestors = printf "%s %s" $frameAncestors . }}
  {{- end }}
  {{- $csp := printf "default-src 'self'; script-src %s; style-src %s; img-src %s; font-src %s; connect-src %s; frame-ancestors %s; base-uri 'self'; form-action 'self'; object-src 'none'" ($sh.scriptSrc | default "'self'") ($sh.styleSrc | default "'self' 'unsafe-inline'") ($sh.imgSrc | default "'self' data:") ($sh.fontSrc | default "'self' data:") ($sh.connectSrc | default "'self'") $frameAncestors }}
  {{- $snippet := printf "add_header Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\" always;\nadd_header X-Content-Type-Options \"nosniff\" always;\nadd_header X-Frame-Options \"DENY\" always;\nadd_header Referrer-Policy \"strict-origin-when-cross-origin\" always;\nadd_header Content-Security-Policy \"%s\" always;\n" $csp }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/configuration-snippet" $snippet }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "anchor-point.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
