{{/*
=============================================================================
Deployment — AnchorPoint backend application pods.

Key design choices mirrored from infra/k8s/workers/deployment.yaml:
  - RollingUpdate strategy (maxUnavailable / maxSurge configurable)
  - Non-root security context, readOnlyRootFilesystem
  - Liveness + readiness probes at /health:3002
  - envFrom ConfigMap (non-sensitive) + individual secretKeyRef (sensitive)
  - Metrics port 9464 exposed alongside HTTP port 3002
=============================================================================
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anchor-point.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anchor-point.labels" . | nindent 4 }}
  annotations:
    # Force a rolling restart whenever the ConfigMap changes
    checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "anchor-point.backend.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "anchor-point.backend.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart pods when the ConfigMap content changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "anchor-point.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "anchor-point.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          # Non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "anchor-point.configMapName" . }}
          # Sensitive config from Secret (individual keys for explicit audit trail)
          env:
            {{- range .Values.secrets.keys }}
            {{- if and (eq . "DATABASE_URL") $.Values.postgres.enabled }}
            # Skipped: postgres.enabled=true, so the in-cluster connection
            # string is injected below instead of the externally-managed one.
            {{- else if and (eq . "REDIS_URL") $.Values.redis.enabled }}
            # Skipped: redis.enabled=true, see below.
            {{- else }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "anchor-point.secretName" $ }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            # Credentials first: the kubelet expands $(VAR) in an env value
            # only from variables defined earlier in this list, so DATABASE_URL
            # below would otherwise keep the literal "$(POSTGRES_USER)".
            # The password is still only ever read from a Secret; the rendered
            # manifest contains a reference, never the secret text.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "anchor-point.postgres.secretName" . }}
                  key: {{ .Values.postgres.auth.userKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anchor-point.postgres.secretName" . }}
                  key: {{ .Values.postgres.auth.passwordKey }}
            # Points at the chart-managed Postgres, not at a managed instance.
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "anchor-point.postgres.fullname" . }}:{{ .Values.postgres.service.port }}/{{ .Values.postgres.database }}"
            {{- end }}
            {{- if .Values.redis.enabled }}
            # Same ordering rule as DATABASE_URL above.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anchor-point.redis.secretName" . }}
                  key: {{ .Values.redis.auth.secretKey }}
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ include "anchor-point.redis.fullname" . }}:{{ .Values.redis.service.port }}"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.postgres.enabled .Values.redis.enabled }}
      # Mirrors the compose ordering: the backend must not boot before the
      # datastores it dials are accepting connections.
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              until pg_isready -h {{ include "anchor-point.postgres.fullname" . }} -p {{ .Values.postgres.service.port }} -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "anchor-point.postgres.secretName" . }}
                  key: {{ .Values.postgres.auth.userKey }}
        {{- end }}
        {{- if .Values.redis.enabled }}
        - name: wait-for-redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              until redis-cli -h {{ include "anchor-point.redis.fullname" . }} -p {{ .Values.redis.service.port }} -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG; do
                echo "waiting for redis..."
                sleep 2
              done
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anchor-point.redis.secretName" . }}
                  key: {{ .Values.redis.auth.secretKey }}
        {{- end }}
      {{- end }}
      restartPolicy: Always
