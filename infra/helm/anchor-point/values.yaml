# =============================================================================
# AnchorPoint Helm Chart - Default Values
# =============================================================================
# These are the base defaults. Override per-environment with:
#   values-staging.yaml  — staging cluster
#   values-prod.yaml     — production cluster
#
# Usage:
#   helm upgrade --install anchor-point ./infra/helm/anchor-point \
#     -f infra/helm/anchor-point/values-staging.yaml \
#     --namespace anchorpoint-staging --create-namespace
# =============================================================================

# -- Global settings ----------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# Kubernetes namespace (used in NOTES.txt; actual namespace set via --namespace)
namespace: anchorpoint

# -- Image --------------------------------------------------------------------
image:
  repository: ghcr.io/ceejaylaboratory/anchorpoint-backend
  pullPolicy: IfNotPresent
  # Overridden in CI/CD with the Git SHA or semver tag
  tag: "latest"

imagePullSecrets: []

# -- Service Account ----------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Replica count ------------------------------------------------------------
replicaCount: 2

# -- Deployment strategy ------------------------------------------------------
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

# -- Container ports ----------------------------------------------------------
service:
  type: ClusterIP
  port: 3002
  metricsPort: 9464
  annotations: {}

# -- Ingress ------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "anchorpoint-staging-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
  hosts:
    - host: api.anchorpoint.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: anchorpoint-api-tls
      hosts:
        - api.anchorpoint.example.com

# -- Resource requests & limits -----------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Horizontal Pod Autoscaler ------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# -- Health probes ------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: 3002
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /health
    port: 3002
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2
  successThreshold: 1

# -- Security context (pod-level) ---------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# -- Security context (container-level) ---------------------------------------
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Pod disruption budget ----------------------------------------------------
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# -- Non-sensitive ConfigMap environment variables ----------------------------
# These are rendered into a ConfigMap and loaded via envFrom
config:
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  PORT: "3002"
  METRICS_PORT: "9464"
  STELLAR_NETWORK: "testnet"
  QUEUE_CONCURRENCY: "5"
  REQUEST_TIMEOUT_MS: "30000"

# -- Secret references --------------------------------------------------------
# The chart expects a pre-existing Secret named <fullname>-secrets (or
# set existingSecret to point to your own).  Keys must match exactly.
secrets:
  # Set existingSecret to the name of a pre-created secret to skip
  # the bundled Secret manifest (recommended for production).
  existingSecret: ""
  # Keys expected inside the secret
  keys:
    - REDIS_URL
    - DATABASE_URL
    - STELLAR_PASSPHRASE
    - STELLAR_DEPLOYER_SECRET
    - JWT_SECRET

# -- Pod annotations (e.g. Prometheus scrape) ---------------------------------
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9464"
  prometheus.io/path: "/metrics"

# -- Node selector / tolerations / affinity -----------------------------------
nodeSelector: {}

tolerations: []

affinity: {}

# -- Extra environment variables (injected directly into the container) -------
extraEnv: []
# - name: SOME_FLAG
#   value: "true"

# -- Extra volumes / volumeMounts (e.g. tmp dir for readOnlyRootFilesystem) ---
extraVolumes:
  - name: tmp
    emptyDir: {}

extraVolumeMounts:
  - name: tmp
    mountPath: /tmp

# -- Redis (optional) --------------------------------------------------------
# Disabled by default: production should point REDIS_URL at a managed Redis.
# When enabled the chart runs a single Redis pod and rewrites the backend's
# REDIS_URL to the in-cluster Service, so REDIS_URL does not have to be edited
# in the backend Secret by hand.
redis:
  enabled: false
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  replicaCount: 1
  # AOF keeps queued BullMQ jobs across a pod restart. The file is only fsynced
  # every 'everysec', so an abrupt node loss can still lose the last second.
  appendOnly: "yes"
  service:
    type: ClusterIP
    port: 6379
  auth:
    # REQUIRED when enabled. Name of an existing Secret holding the password,
    # or leave empty to use <fullname>-redis.
    existingSecret: ""
    secretKey: redis-password
  persistence:
    # Disable only for throwaway environments — /data is an emptyDir then and
    # all queue state is lost when the pod is replaced.
    enabled: true
    size: 8Gi
    # Empty means "use the cluster default StorageClass".
    storageClass: ""
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []

# -- PostgreSQL (optional) ---------------------------------------------------
# Disabled by default: production should point DATABASE_URL at a managed
# Postgres. When enabled the chart runs a single-replica StatefulSet and
# rewrites the backend's DATABASE_URL to the in-cluster Service.
#
# WARNING: this is a single-replica StatefulSet with one PVC. No replica set,
# no failover, no point-in-time recovery — it exists so a single cluster (dev,
# staging, CI) can be brought up from this chart alone, and it is not sized or
# tuned for production data. Keep postgres.enabled=false on production and
# supply DATABASE_URL from the backend Secret.
postgres:
  enabled: false
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  database: anchorpoint
  service:
    type: ClusterIP
    port: 5432
  auth:
    # REQUIRED when enabled. Secret must hold the two keys below; empty names
    # fall back to <fullname>-postgres, which the chart does not create (no
    # plaintext passwords in a chart).
    existingSecret: ""
    userKey: postgres-user
    passwordKey: postgres-password
  persistence:
    size: 20Gi
    # Empty means "use the cluster default StorageClass".
    storageClass: ""
  extraEnv: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  nodeSelector: {}
  tolerations: []

# -- Dashboard (optional) ----------------------------------------------------
# Disabled by default. The dashboard image is a static nginx bundle that calls
# the API from the browser, so the API URL is baked in at build time and is not
# configurable from values here.
dashboard:
  enabled: false
  image:
    repository: ghcr.io/ceejaylaboratory/anchorpoint-dashboard
    pullPolicy: IfNotPresent
    # Override per release with --set dashboard.image.tag=<semver>.
    tag: "latest"
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: dashboard.anchorpoint.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    # - secretName: anchorpoint-dashboard-tls
    #   hosts:
    #     - dashboard.anchorpoint.example.com
  podAnnotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
