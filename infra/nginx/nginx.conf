resolver 127.0.0.11 ipv6=off valid=30s;

log_format json_combined escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"route":"$uri",'
    '"status_code":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_id":"$http_x_request_id",'
    '"trace_id":"$http_x_trace_id",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"environment":"production"}';

upstream anchorpoint_dashboard {
    zone anchorpoint_dashboard 64k;
    server dashboard:80 resolve;
    keepalive 64;
}

upstream anchorpoint_backend {
    zone anchorpoint_backend 64k;
    least_conn;
    server backend-1:3002 resolve max_fails=3 fail_timeout=30s;
    server backend-2:3002 resolve max_fails=3 fail_timeout=30s;
    server backend-3:3002 resolve max_fails=3 fail_timeout=30s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    brotli_min_length 256;

    client_body_buffer_size 128k;

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://anchorpoint_backend/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://anchorpoint_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /.well-known/stellar.toml {
        proxy_pass http://anchorpoint_backend/.well-known/stellar.toml;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /info {
        proxy_pass http://anchorpoint_backend/info;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /auth {
        proxy_pass http://anchorpoint_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /sep10 {
        proxy_pass http://anchorpoint_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /sep24 {
        # SEP-24 interactive webviews must be embeddable by designated partner domains.
        # Override the default DENY/CSP headers set at server level.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'self' https://*.partner.example.com" always;

        proxy_pass http://anchorpoint_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /sep38 {
        proxy_pass http://anchorpoint_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        # Vite emits content-hashed filenames under /assets/, so they can be cached forever.
        # add_header here replaces the server-level headers, so repeat them.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        proxy_pass http://anchorpoint_dashboard;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://anchorpoint_dashboard;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
