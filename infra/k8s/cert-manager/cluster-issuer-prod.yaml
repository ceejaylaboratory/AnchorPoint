# =============================================================================
# ClusterIssuer for Let's Encrypt Production - Issue #419
# =============================================================================
# This ClusterIssuer uses the Let's Encrypt production environment.
# Switch to this after testing with the staging issuer.
#
# IMPORTANT: The ACME registration email below is used for certificate
# expiration notices and account recovery. Update it to your ops alias if
# needed (e.g. via a Kustomize overlay / secret), but never commit secrets.
#
# Issuer name: anchorpoint-prod-issuer
#   This is the ClusterIssuer referenced by Ingress annotations:
#     cert-manager.io/cluster-issuer: anchorpoint-prod-issuer
#   Keep this name in sync with the ingress manifests in
#   infra/k8s/ingress-nginx/.
#
# Rate Limits (production):
#   - 50 certificates per registered domain per week
#   - 5 duplicate certificate requests per week
#   - 5 renewal requests per week
# =============================================================================

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  # Name referenced by Certificate resources in production
  name: anchorpoint-prod-issuer
  # Consistent labeling for all AnchorPoint resources
  labels:
    app: anchorpoint
    component: cert-manager
    environment: production
spec:
  # ACME protocol for Let's Encrypt integration
  acme:
    # Server endpoint - Let's Encrypt production (use for live traffic)
    server: https://acme-v02.api.letsencrypt.org/directory
    
    # Email for ACME registration and notifications
    email: platform@anchorpoint.example.com
    
    # Private key for ACME account (stored in Kubernetes)
    privateKeySecretRef:
      name: anchorpoint-prod-issuer-account-key
    
    # ACME challenge configuration
    solvers:
      # HTTP-01 challenge - requires ingress controller with annotation support
      # Used for standard (non-wildcard) hostnames.
      - http01:
          ingress:
            # Ingress class for the solver (nginx)
            class: nginx
            # Pod namespace for the ingress controller
            podNamespace: ingress-nginx
            # Service type for the ingress controller service
            serviceType: ClusterIP

      # DNS-01 challenge - required for wildcard certificates (e.g. *.anchorpoint.example.com)
      # and useful when HTTP-01 is not reachable from the public internet.
      #
      # NOTE: This solver is disabled by default. To enable it:
      #   1. Uncomment the block below.
      #   2. Create the referenced credentials Secret in the cert-manager namespace
      #      (e.g. via External Secrets / Sealed Secrets - never commit plaintext).
      #   3. Ensure the DNS provider supports the ACME DNS-01 TXT record.
      #
      # - dns01:
      #     # Example: Route53 provider (swap for your DNS provider)
      #     route53:
      #       region: us-east-1
      #       # Secret containing AWS credentials (key: secret-access-key)
      #       accessKeyIDSecretRef:
      #         name: anchorpoint-prod-issuer-route53
      #         key: access-key-id
      #       secretAccessKeySecretRef:
      #         name: anchorpoint-prod-issuer-route53
      #         key: secret-access-key
      #   selector:
      #     # Only use DNS-01 for wildcard hostnames
      #     dnsZones:
      #       - "anchorpoint.example.com"